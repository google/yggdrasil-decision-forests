name: Python Build and Test

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      container_image:
        required: false
        type: string
        default: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      python_version:
        required: true
        type: string
        description: "The Python version to set up (e.g., '3.9', '3.10')."
      refresh_cache:
        required: false
        type: boolean
        default: false
        description: "Force refresh the cache"
      pull_request_base_sha:
        required: false
        type: string
        description: "SHA of the PR"

jobs:
  build-test:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container_image }}
    env:
      BAZEL_PY_FLAGS: >-
        --repository_cache=../../../.bazel-cache/repository
        --disk_cache=../../../.bazel-cache/disk
        --config=linux_cpp17
        --config=linux_avx2
        --features=-fully_static_link
        --@rules_python//python/config_settings:python_version=${{ inputs.python_version }}
      REFRESH_CACHE: ${{ inputs.refresh_cache }}
      GH_TOKEN: ${{ github.token }} # Required for gh cache delete
    permissions:
      actions: write  # For gh cache delete
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Set safe directory  # https://github.com/actions/checkout/issues/2031
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # --- Bazel Cache Setup ---
      - name: Set up Bazel cache keys
        id: bazel-cache-keys
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          PYTHON_VERSION: ${{ inputs.python_version }}
          MODULE_HASH: ${{ hashFiles('**/MODULE.bazel', 'yggdrasil_decision_forests/port/python/.bazelrc', 'yggdrasil_decision_forests/port/python/.bazelversion', '**/requirements_lock.txt') }}
          BUILD_HASH: ${{ hashFiles('**/BUILD*') }}
          COMMIT_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ inputs.pull_request_base_sha }}
        run: |
          CACHE_RESTORE_KEY_3="$RUNNER_OS_NAME-bazel-py"
          CACHE_RESTORE_KEY_2="$CACHE_RESTORE_KEY_3-$PYTHON_VERSION"
          CACHE_RESTORE_KEY_1="$CACHE_RESTORE_KEY_2-$MODULE_HASH"
          CACHE_RESTORE_KEY_0="$CACHE_RESTORE_KEY_1-$BUILD_HASH"
          CACHE_KEY="$CACHE_RESTORE_KEY_0-$COMMIT_SHA"
          echo "CACHE_RESTORE_KEY_3=$CACHE_RESTORE_KEY_3" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_2=$CACHE_RESTORE_KEY_2" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_1=$CACHE_RESTORE_KEY_1" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_0=$CACHE_RESTORE_KEY_0" >> "$GITHUB_OUTPUT"
          echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
            CACHE_RESTORE_KEY_HEAD="$CACHE_RESTORE_KEY_0-$PULL_REQUEST_BASE_SHA"
            echo "CACHE_RESTORE_KEY_HEAD=$CACHE_RESTORE_KEY_HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean Bazel build outputs if cache is being refreshed
        if: env.REFRESH_CACHE == 'true'
        run: |
          bazel clean --expunge
          rm -rf .bazel-cache

      - name: Restore Bazel cache
        id: bazel-cache
        if: env.REFRESH_CACHE != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .bazel-cache
          key: ${{ steps.bazel-cache-keys.outputs.CACHE_KEY }}
          restore-keys: |
            ${{ steps.bazel-cache-keys.outputs.CACHE_RESTORE_KEY_HEAD }}
            ${{ steps.bazel-cache-keys.outputs.CACHE_RESTORE_KEY_0 }}-
            ${{ steps.bazel-cache-keys.outputs.CACHE_RESTORE_KEY_1 }}-
            ${{ steps.bazel-cache-keys.outputs.CACHE_RESTORE_KEY_2 }}-
            ${{ steps.bazel-cache-keys.outputs.CACHE_RESTORE_KEY_3 }}-

      - name: Check Bazel cache hit
        env:
          CACHE_HIT: ${{ steps.bazel-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.bazel-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.bazel-cache.outputs.cache-matched-key }}
        run: |
          echo "Bazel Cache Hit: $CACHE_HIT"
          echo "Bazel Cache Primary Key: $CACHE_PRIMARY_KEY"
          echo "Bazel Cache Matched Key: $CACHE_MATCHED_KEY"

      - name: Create Bazel Cache Directories
        run: mkdir -p .bazel-cache/repository .bazel-cache/disk

      # --- Build and Test Steps ---
      - name: Set up Bazel tag filters
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          case $PYTHON_VERSION in
            3.13|3.14)
              # TensorFlow and Grain are not available for these Python
              # versions (see dev_requirements.txt).
              echo "BAZEL_TAG_FILTERS=--build_tag_filters=-tf_dep,-grain_dep --test_tag_filters=-tf_dep,-grain_dep" >> "$GITHUB_ENV"
              ;;
            *)
              echo "BAZEL_TAG_FILTERS=" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build Python
        working-directory: yggdrasil_decision_forests/port/python
        # BAZEL_PY_FLAGS is intentionally unquoted so it is split into separate flags.
        run: |
          bazel version
          bazel build //ydf/...:all \
            $BAZEL_PY_FLAGS $BAZEL_TAG_FILTERS

      - name: Test Python
        working-directory: yggdrasil_decision_forests/port/python
        id: py_test
        continue-on-error: true
        # BAZEL_PY_FLAGS is intentionally unquoted so it is split into separate flags.
        run: |
          bazel test //ydf/...:all \
            $BAZEL_PY_FLAGS \
            $BAZEL_TAG_FILTERS \
            --test_output=errors \
            --output_groups=+test_xml

      # Checks that the wheel is manylinux_2_27 compliant (auditwheel repair
      # fails otherwise) and that it works.
      - name: Package Python
        working-directory: yggdrasil_decision_forests/port/python
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        # The default shell of container jobs is sh, which has no `source`.
        shell: bash
        # BAZEL_PY_FLAGS is intentionally unquoted so it is split into separate flags.
        run: |
          bazel run $BAZEL_PY_FLAGS \
            @rules_python//python/bin:python -- -m venv --clear /tmp/venv
          source /tmp/venv/bin/activate
          ./tools/package_linux.sh

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ydf-wheel-${{ inputs.python_version }}
          path: yggdrasil_decision_forests/port/python/dist/*manylinux_2_27_*.whl
          retention-days: 14

      - uses: ./.github/actions/handle-test-outcome
        with:
          test_outcome: ${{ steps.py_test.outcome }}
          reporter_name: "Bazel Python Tests (${{ inputs.python_version }})"
          testlogs_xml_path: yggdrasil_decision_forests/port/python/bazel-testlogs/**/*.xml
          artifact_name: py-test-logs-${{ inputs.python_version }}
          testlogs_log_path: bazel-testlogs/**/*.log
          failure_message: "Python tests failed for Python ${{ inputs.python_version }}. See annotations in the Checks tab for details, or 'py-test-logs-${{ inputs.python_version }}' artifact for full logs."
          working_directory: yggdrasil_decision_forests/port/python

      # --- Cache Saving ---
      - name: Remove old Bazel cache if refreshing
        if: ${{ !cancelled() && env.REFRESH_CACHE == 'true' }}
        continue-on-error: true # Ignore errors when cache is not found.
        env:
          CACHE_KEY: ${{ steps.bazel-cache-keys.outputs.CACHE_KEY }}
        run: gh cache delete "$CACHE_KEY"

      - name: Save Bazel cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ !cancelled() && (env.REFRESH_CACHE == 'true' || steps.bazel-cache.outputs.cache-hit != 'true') }}
        with:
          path: .bazel-cache
          key: ${{ steps.bazel-cache-keys.outputs.CACHE_KEY }}
