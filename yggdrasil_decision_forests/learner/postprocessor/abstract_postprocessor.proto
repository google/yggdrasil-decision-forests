syntax = "proto2";

package yggdrasil_decision_forests.model.postprocessor.proto;

import "yggdrasil_decision_forests/learner/postprocessor/smoothed_pav_calibrator/smoothed_pav_calibrator.proto";

option java_multiple_files = true;
option java_outer_classname = "AbstractPostprocessorTrainingConfig";

message AbstractPostprocessorTrainingConfig {
  optional bool use_validation_dataset = 1 [default = false];

  oneof postprocessor {
    smoothed_pav_calibrator.proto.SmoothedPavCalibratorTrainingConfig
        smoothed_pav_calibrator_training_config = 2;
  }
}
